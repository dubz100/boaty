[project]
name = "boaty"
version = "0.1.0"
description = "Boaty Mk1: mission control, boat services and simulator"
requires-python = ">=3.11"
dependencies = ["pymavlink>=2.4.40", "Pillow>=10", "anthropic>=1.9",
                "pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boaty*"]          # not sites/, params/ or results/

[project.scripts]
boaty-mc = "boaty.mcn.app:main"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "coverage>=7"]
docs = ["reportlab>=4", "matplotlib>=3.8", "numpy>=1.26", "pymupdf>=1.24"]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sitl: needs a built ArduPilot SITL binary (set ARDUPILOT_HOME or BOATY_ARDUROVER)",
    "verifies(*ids): SRS requirements this test verifies (collected into the VCRM by tools/vcrm.py)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"boaty/mcn/web.py" = ["E501"]     # the embedded HTML/JS page

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true       # pymavlink has no type stubs
